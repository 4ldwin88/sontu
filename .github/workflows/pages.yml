name: Deploy Sontu app to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build hosted application
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://zukfxasttgmtygnsqqav.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_HOaki0v0jS9BmMSv8MuQng_Oh4X39wm
          VITE_REGISTRATION_ENABLED: "true"
          VITE_INVITATION_VERIFICATION_ENABLED: "true"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
