name: Design foundation checks
on:
  push:
    branches: [checkpoint/design-foundation, checkpoint/core-validation]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start isolated Auth and database
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Prepare disposable browser identity
        run: |
          supabase status -o json > /tmp/sontu-local-status.json
          node scripts/prepare-local-browser.mjs
      - name: Build against isolated backend
        run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-foundation-evidence
          path: |
            test-results/
            playwright-report/
